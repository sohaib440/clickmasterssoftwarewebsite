name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  sync-main:
    name: Sync master → main
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to master
        run: |
          git fetch origin main || true
          git push --force-with-lease origin HEAD:main

  deploy:
    name: Deploy to VPS (PM2)
    needs: [quality, sync-main]
    # Run when quality passed and (sync succeeded OR was skipped because push was to main)
    if: |
      always() &&
      needs.quality.result == 'success' &&
      (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/var/www/NEXT"
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              APP_DIR="${{ secrets.DEPLOY_PATH }}"
            fi
            cd "$APP_DIR"
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 reload NEXT --update-env
            pm2 save
            pm2 status
