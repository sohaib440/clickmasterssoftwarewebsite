name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  APP_PORT: 3000
  APP_NAME: NEXT
  WEBSITE_URL: https://nextsoftwaredevelopment.com

jobs:
  # 1) Lint
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  # 2) Build
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  # 3) Deploy to VPS (app already running as PM2 "NEXT")
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy with Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
           
            echo "🚀 DEPLOYMENT STARTED"

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              source "$NVM_DIR/nvm.sh"
              nvm use 20 || nvm install 20
            fi

            APP_DIR="/var/www/NEXT"
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              APP_DIR="${{ secrets.DEPLOY_PATH }}"
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "❌ App directory not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "📦 Current commit: $(echo "$PREVIOUS_COMMIT" | cut -c1-7)"

            echo "📥 Pulling origin/main..."
            git fetch origin
            if ! git reset --hard origin/main; then
              echo "❌ Failed to update code"
              exit 1
            fi

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "📦 New commit: $(echo "$NEW_COMMIT" | cut -c1-7)"

            echo "📦 Installing dependencies..."
            if ! npm ci; then
              echo "❌ npm ci failed — rolling back"
              git reset --hard "$PREVIOUS_COMMIT"
              exit 1
            fi

            echo "🏗️ Building..."
            if ! npm run build; then
              echo "❌ Build failed — rolling back"
              git reset --hard "$PREVIOUS_COMMIT"
              npm ci
              npm run build || true
              pm2 reload "${{ env.APP_NAME }}" --update-env || pm2 restart "${{ env.APP_NAME }}"
              exit 1
            fi

            echo "🔄 Reloading PM2: ${{ env.APP_NAME }}"
            pm2 reload "${{ env.APP_NAME }}" --update-env
            pm2 save

            echo "⏳ Waiting for app..."
            sleep 10

            HEALTHY=false
            for i in 1 2 3 4 5; do
              LOCAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 10 \
                "http://127.0.0.1:${{ env.APP_PORT }}" || echo "failed")

              if [ "$LOCAL_STATUS" = "200" ] || [ "$LOCAL_STATUS" = "301" ] || [ "$LOCAL_STATUS" = "302" ]; then
                HEALTHY=true
                echo "✅ Health check passed (HTTP $LOCAL_STATUS)"
                break
              fi
              echo "⏳ Health check $i/5: $LOCAL_STATUS"
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "❌ Health check failed — rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              npm ci
              npm run build
              pm2 reload "${{ env.APP_NAME }}" --update-env
              exit 1
            fi

            echo "✅ DEPLOYMENT COMPLETED"
            pm2 status

  # 4) Verify public site
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify Website
        run: |
          MAX_ATTEMPTS=8
          ATTEMPT=1
          SUCCESS=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 --location \
              "${{ env.WEBSITE_URL }}" || echo "000")

            case "$HTTP_CODE" in
              200|301|302)
                echo "✅ Website OK (HTTP $HTTP_CODE)"
                SUCCESS=true
                break
                ;;
              *)
                echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $HTTP_CODE"
                ;;
            esac

            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ] && sleep 8
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Website verification failed"
            exit 1
          fi

  # 5) Summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [quality, build, deploy, verify]
    if: always()
    steps:
      - name: Display Summary
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Build:   ${{ needs.build.result }}"
          echo "Deploy:  ${{ needs.deploy.result }}"
          echo "Verify:  ${{ needs.verify.result }}"
          echo "App:     ${{ env.APP_NAME }}"
          echo "URL:     ${{ env.WEBSITE_URL }}"

          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.verify.result }}" = "success" ]; then
            echo "✅ Production deployment succeeded"
          else
            echo "❌ Deployment failed — check logs / VPS"
            exit 1
          fi
