name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  APP_PORT: 9000
  APP_NAME: NEXT
  WEBSITE_URL: https://nextsoftwaredevelopment.com

jobs:
  # 1) Code Quality
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint || true

      - name: Security Audit
        run: npm audit --audit-level=high || true

  # 2) Build
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  # 3) Manual Approval
  approval:
    name: Manual Approval Required
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ env.WEBSITE_URL }}
    steps:
      - name: Display Approval Instructions
        run: |
          echo "=========================================="
          echo "⏳ MANUAL APPROVAL REQUIRED"
          echo "=========================================="
          echo "Website: ${{ env.WEBSITE_URL }}"
          echo "App:     ${{ env.APP_NAME }}"
          echo "Port:    ${{ env.APP_PORT }}"
          echo "Approve via Actions → Review deployments"
          echo "=========================================="

  # 4) Deploy to VPS
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approval
    environment:
      name: production
      url: ${{ env.WEBSITE_URL }}
    steps:
      - name: Deploy Application with Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            echo "=========================================="
            echo "🚀 DEPLOYMENT STARTED"
            echo "=========================================="

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
              echo "✅ NVM loaded"
              nvm use 20 || nvm install 20
            fi

            node -v
            npm -v

            APP_DIR="/var/www/NEXT"
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              APP_DIR="${{ secrets.DEPLOY_PATH }}"
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "❌ App directory not found: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            BACKUP_DIR="$APP_DIR/../backups"
            mkdir -p "$BACKUP_DIR"

            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            PREVIOUS_COMMIT_SHORT=$(echo "$PREVIOUS_COMMIT" | cut -c1-7)
            echo "📦 Current commit: $PREVIOUS_COMMIT_SHORT"

            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_PATH="$BACKUP_DIR/backup_${PREVIOUS_COMMIT_SHORT}_${TIMESTAMP}"

            echo "💾 Creating backup of current build..."
            if [ -d "node_modules" ] && [ -d ".next" ]; then
              mkdir -p "$BACKUP_PATH"
              cp -r node_modules .next package.json package-lock.json "$BACKUP_PATH/" 2>/dev/null || true
              echo "✅ Backup created at: $BACKUP_PATH"
            fi

            echo "📝 Saving PM2 logs..."
            pm2 logs "${{ env.APP_NAME }}" --lines 100 --nostream > "$BACKUP_PATH/pm2_logs.txt" 2>/dev/null || true

            echo "📥 Fetching latest code..."
            git fetch origin

            NEW_COMMIT=$(git rev-parse origin/main)
            NEW_COMMIT_SHORT=$(echo "$NEW_COMMIT" | cut -c1-7)
            echo "📦 New commit: $NEW_COMMIT_SHORT"

            echo "🔄 Updating to origin/main..."
            if ! git reset --hard origin/main; then
              echo "❌ Failed to update code"
              exit 1
            fi

            echo "📦 Installing dependencies..."
            if ! npm ci; then
              echo "❌ Failed to install dependencies — rolling back"
              git reset --hard "$PREVIOUS_COMMIT"
              exit 1
            fi

            echo "🏗️ Building application..."
            if ! npm run build; then
              echo "❌ Build failed — rolling back"
              git reset --hard "$PREVIOUS_COMMIT"
              if [ -d "$BACKUP_PATH/node_modules" ]; then
                rm -rf node_modules
                cp -r "$BACKUP_PATH/node_modules" ./
              fi
              if [ -d "$BACKUP_PATH/.next" ]; then
                rm -rf .next
                cp -r "$BACKUP_PATH/.next" ./
              fi
              exit 1
            fi

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            echo "🔄 Reloading PM2: ${{ env.APP_NAME }}"
            if pm2 describe "${{ env.APP_NAME }}" > /dev/null 2>&1; then
              pm2 reload "${{ env.APP_NAME }}" --update-env
            else
              pm2 start npm --name "${{ env.APP_NAME }}" -- start
            fi
            pm2 save

            echo "⏳ Waiting for application to start..."
            sleep 15

            echo "🏥 Performing health check..."
            HEALTHY=false
            for i in 1 2 3 4 5; do
              LOCAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 10 \
                "http://127.0.0.1:${{ env.APP_PORT }}" || echo "failed")

              if [ "$LOCAL_STATUS" = "200" ] || [ "$LOCAL_STATUS" = "301" ] || [ "$LOCAL_STATUS" = "302" ]; then
                HEALTHY=true
                echo "✅ Health check passed (HTTP $LOCAL_STATUS)"
                break
              fi
              echo "⏳ Health check attempt $i/5: $LOCAL_STATUS"
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "❌ Health check failed — rolling back"
              git reset --hard "$PREVIOUS_COMMIT"
              if [ -d "$BACKUP_PATH" ]; then
                rm -rf node_modules .next
                cp -r "$BACKUP_PATH/node_modules" "$BACKUP_PATH/.next" ./ 2>/dev/null || true
                cp "$BACKUP_PATH/package.json" "$BACKUP_PATH/package-lock.json" ./ 2>/dev/null || true
              fi
              pm2 reload "${{ env.APP_NAME }}" --update-env || pm2 restart "${{ env.APP_NAME }}"
              sleep 10
              echo "❌ Deployment failed — rolled back to $PREVIOUS_COMMIT_SHORT"
              exit 1
            fi

            echo "🧹 Cleaning up old backups..."
            cd "$BACKUP_DIR"
            ls -t | tail -n +6 | xargs -r rm -rf
            cd "$APP_DIR"

            echo "=========================================="
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "Website: ${{ env.WEBSITE_URL }}"
            echo "App: ${{ env.APP_NAME }}"
            echo "New: $NEW_COMMIT_SHORT | Previous: $PREVIOUS_COMMIT_SHORT"
            echo "=========================================="
            pm2 status

  # 5) Verify
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Verify Website is Accessible
        run: |
          MAX_ATTEMPTS=12
          ATTEMPT=1
          SUCCESS=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 --location \
              "${{ env.WEBSITE_URL }}" || echo "000")

            case $HTTP_CODE in
              200|301|302)
                echo "✅ Website is accessible! (HTTP $HTTP_CODE)"
                SUCCESS=true
                break
                ;;
              000)
                echo "⏳ Connection timeout — retrying..."
                ;;
              *)
                if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
                  echo "✅ Website responded with HTTP $HTTP_CODE"
                  SUCCESS=true
                  break
                fi
                echo "⚠️ Got HTTP $HTTP_CODE — retrying..."
                ;;
            esac

            ATTEMPT=$((ATTEMPT + 1))
            [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ] && sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Website verification failed"
            exit 1
          fi

  # 6) Rollback if verify fails
  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()
    steps:
      - name: Perform Emergency Rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚨 EMERGENCY ROLLBACK INITIATED"

            APP_DIR="/var/www/NEXT"
            if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
              APP_DIR="${{ secrets.DEPLOY_PATH }}"
            fi
            BACKUP_DIR="$APP_DIR/../backups"

            cd "$APP_DIR"
            LATEST_BACKUP=$(ls -t "$BACKUP_DIR" 2>/dev/null | head -1)

            if [ -n "$LATEST_BACKUP" ] && [ -d "$BACKUP_DIR/$LATEST_BACKUP" ]; then
              echo "📦 Found backup: $LATEST_BACKUP"
              rm -rf node_modules .next
              cp -r "$BACKUP_DIR/$LATEST_BACKUP/node_modules" \
                    "$BACKUP_DIR/$LATEST_BACKUP/.next" \
                    "$BACKUP_DIR/$LATEST_BACKUP/package.json" \
                    "$BACKUP_DIR/$LATEST_BACKUP/package-lock.json" ./ 2>/dev/null || true
              pm2 reload "${{ env.APP_NAME }}" --update-env || pm2 restart "${{ env.APP_NAME }}"
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found for rollback"
              exit 1
            fi

  # 7) Summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [quality, build, approval, deploy, verify, rollback]
    if: always()
    steps:
      - name: Display Summary
        run: |
          echo "Quality:  ${{ needs.quality.result }}"
          echo "Build:    ${{ needs.build.result }}"
          echo "Approval: ${{ needs.approval.result }}"
          echo "Deploy:   ${{ needs.deploy.result }}"
          echo "Verify:   ${{ needs.verify.result }}"
          echo "Rollback: ${{ needs.rollback.result }}"
          echo "Website:  ${{ env.WEBSITE_URL }}"
          echo "App:      ${{ env.APP_NAME }}"
          echo "Port:     ${{ env.APP_PORT }}"

          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.verify.result }}" = "success" ]; then
            echo "✅ Production deployment completed successfully"
          elif [ "${{ needs.rollback.result }}" = "success" ]; then
            echo "⚠️ Deploy failed — rolled back"
          else
            echo "❌ Deployment failed — check logs"
            exit 1
          fi
